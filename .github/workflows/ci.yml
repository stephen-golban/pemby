name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

      # The same reason key is rendered twice by two different mechanisms: the Brief through
      # next-intl from `apps/web/messages/en/brief.json`, and Telegram, email and push through
      # `@pemby/core`'s own tables, because the worker and the bot cannot read a next-intl
      # catalogue. Nothing else notices when the two drift, and drift would make one match read two
      # different ways depending on where the user saw it.
      - name: Reason strings match between core and the web messages
        run: pnpm --filter @pemby/core check:reasons

      - run: pnpm build
